<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Stop a stale build being served from the browser's own cache. A week-old
       copy of this app looks like every recent fix has failed to apply. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="unix_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>unix_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="unix-loading" role="status" style="position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:white;font:16px system-ui;color:#1e293b">
    <strong style="font-size:28px;color:#002ddf">UNIX</strong>
    <p id="unix-loading-message">Starting UNIX…</p>
    <button id="unix-reload" hidden onclick="location.reload()" style="padding:12px 24px;border:0;border-radius:24px;background:#002ddf;color:white;cursor:pointer">Reload app</button>
  </div>
  <script>
    const unixLoadingTimeout = setTimeout(() => {
      const message = document.getElementById('unix-loading-message');
      if (message) {
        message.textContent = 'Still loading. Check that the local server is running.';
        document.getElementById('unix-reload').hidden = false;
      }
    }, 45000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(unixLoadingTimeout);
      document.getElementById('unix-loading')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
